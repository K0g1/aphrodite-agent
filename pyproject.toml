[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aphrodite-agent"
version = "0.1.0"
description = "A personal AI companion harness with deterministic world engine and memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kevin Deng" }]

dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "keyring>=25.0",
    "structlog>=24.1",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.4",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aphrodite = "aphrodite_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aphrodite", "src/aphrodite_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
